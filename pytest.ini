[pytest]
python_files = Prueba*.py test_*.py
python_classes = Test*
python_functions = test_*
bdd_features_base_dir = apps

markers =
    bdd: Pruebas basadas en comportamiento (Gherkin/BDD)
    smoke: Pruebas de humo
    regression: Pruebas de regresión
    critical: Pruebas de prioridad crítica
    login: Pruebas de autenticación en SAP
    arribo: Flujo de arribo de transporte / TU
    cortina: Flujo de asignación de cortina
    chocolate: Flujo completo de recibo chocolate
    rfui: Transacciones RFUI de SAP EWM
    jira: Vinculación con issue de Jira (ej. @pytest.mark.jira("PC-592"))

filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
